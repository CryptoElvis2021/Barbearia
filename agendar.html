<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="__BRAND__">
<meta name="description" content="__DESCRIPTION__">
<title>__SHOP_NAME__ – Agendamento</title>
__OG__
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: __BRAND__;
    --accent: __ACCENT__;
    --bg: #eef0f3;
    --card: #ffffff;
    --ink: #1b2230;
    --muted: #5d6677;
    --line: #dde1e8;
    --ok: #17794a;
    --blue: #2b5fb8;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --text: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 var(--text);
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* ---------- Topo com o logo ---------- */
  .hero {
    background: var(--brand); color: #fff; text-align: center;
    padding: calc(env(safe-area-inset-top) + 30px) 20px 30px;
  }
  .logo-wrap {
    width: 156px; height: 156px; margin: 0 auto 18px; border-radius: 50%;
    background: #fff; display: grid; place-items: center; overflow: hidden;
    box-shadow: 0 0 0 4px var(--accent), 0 0 0 9px rgba(255,255,255,.14), 0 16px 32px rgba(0,0,0,.35);
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 10px; display: block; }
  /* Logo retangular (não quadrado): vira um cartão com cantos arredondados, sem cortar o desenho */
  .logo-wrap.wide {
    width: min(78vw, 300px); height: auto; border-radius: 22px; background: #000; display: block;
    box-shadow: 0 0 0 3px var(--accent), 0 0 0 8px rgba(255,255,255,.12), 0 16px 32px rgba(0,0,0,.45);
  }
  .logo-wrap.wide img { height: auto; padding: 0; object-fit: cover; }
  .logo-wrap .mono {
    font: 700 56px/1 var(--display); color: var(--brand); letter-spacing: -.02em;
  }
  .hero h1 {
    margin: 0; font: 700 clamp(26px, 8vw, 34px)/1.1 var(--display); letter-spacing: -.01em;
    text-wrap: balance;
  }
  .hero p { margin: 8px auto 0; max-width: 28ch; color: rgba(255,255,255,.78); font-size: 15px; }
  .pole {
    height: 12px;
    background: repeating-linear-gradient(-45deg,
      var(--accent) 0 12px, #fff 12px 24px, var(--blue) 24px 36px, #fff 36px 48px);
  }

  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 8px; }

  /* ---------- Passos ---------- */
  .step { margin-bottom: 26px; scroll-margin-top: 14px; }
  .step h2 {
    display: flex; align-items: center; gap: 10px; margin: 0 0 12px;
    font: 600 21px/1.2 var(--display);
  }
  .step h2 .n {
    flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: #fff;
    display: grid; place-items: center; font: 700 14px/1 var(--text);
  }
  .sub { margin: 18px 0 8px; font-weight: 600; font-size: 15px; }

  .svc { display: block; margin-bottom: 10px; position: relative; }
  .svc input, .chip input, .pill input { position: absolute; opacity: 0; pointer-events: none; }
  .svc .in {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--card);
    border: 2px solid transparent; border-radius: 16px; box-shadow: 0 1px 2px rgba(20,40,75,.08);
    transition: border-color .15s, box-shadow .15s;
  }
  .svc .photo { flex: none; width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--line); }
  .svc .txt { flex: 1; min-width: 0; }
  .svc .name { display: block; font-weight: 700; font-size: 17px; }
  .svc .desc { display: block; color: var(--muted); font-size: 14px; margin-top: 1px; }
  .svc .meta { display: block; margin-top: 6px; font-weight: 600; font-size: 15px; }
  .svc .meta span { color: var(--muted); font-weight: 500; margin-left: 8px; }
  .svc .tick {
    flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line);
    display: grid; place-items: center; color: transparent; transition: all .15s;
  }
  .svc.on .in { border-color: var(--accent); box-shadow: 0 4px 14px rgba(20,40,75,.14); }
  .svc.on .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
  .svc input:focus-visible + .in { outline: 3px solid var(--blue); outline-offset: 2px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip, .pill { position: relative; }
  .chip .in, .pill .in {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px;
    background: var(--card); border: 2px solid var(--line); font-weight: 600; font-size: 15px;
    transition: all .15s;
  }
  .chip .in small { color: var(--muted); font-weight: 500; font-size: 14px; }
  .chip.on .in, .pill.on .in { background: var(--brand); border-color: var(--brand); color: #fff; }
  .chip.on .in small { color: rgba(255,255,255,.8); }
  .chip input:focus-visible + .in, .pill input:focus-visible + .in { outline: 3px solid var(--blue); outline-offset: 2px; }

  .dates {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 10px; margin: 0 -16px;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .dates::-webkit-scrollbar { display: none; }
  .date {
    flex: none; width: 64px; padding: 10px 0; border-radius: 14px; border: 2px solid var(--line);
    background: var(--card); text-align: center; scroll-snap-align: start; transition: all .15s;
  }
  .date .w { display: block; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: lowercase; }
  .date .d { display: block; font: 700 24px/1.15 var(--display); }
  .date .m { display: block; font-size: 12px; color: var(--muted); }
  .date.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .date.on .w, .date.on .m { color: rgba(255,255,255,.8); }

  .times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
  .time {
    padding: 12px 0; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
    font-weight: 700; font-variant-numeric: tabular-nums; transition: all .15s;
  }
  .time.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .note { color: var(--muted); font-size: 15px; margin: 6px 0 0; }

  .sheet { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: 0 1px 2px rgba(20,40,75,.08); }
  .sum { margin: 0 0 16px; padding: 0; display: grid; gap: 10px; }
  .sum div { display: flex; justify-content: space-between; gap: 16px; }
  .sum dt { color: var(--muted); }
  .sum dd { margin: 0; font-weight: 600; text-align: right; }
  .sum .total { padding-top: 12px; border-top: 1px solid var(--line); font-size: 18px; }
  .sum .total dd { font: 700 22px/1.1 var(--display); }
  .pay { margin: -4px 0 14px; color: var(--muted); font-size: 14px; }

  label.f { display: block; margin-bottom: 12px; font-weight: 600; font-size: 15px; }
  label.f input {
    display: block; width: 100%; margin-top: 6px; padding: 13px 14px; font-size: 16px; font-weight: 500;
    border: 2px solid var(--line); border-radius: 12px; background: #fff;
  }
  label.f input:focus { border-color: var(--blue); outline: none; }

  .btn {
    display: block; width: 100%; padding: 16px; border: 0; border-radius: 14px; background: var(--accent);
    color: #fff; font-weight: 700; font-size: 18px; box-shadow: 0 6px 16px rgba(0,0,0,.18);
  }
  .btn:disabled { opacity: .55; box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--brand); border: 2px solid var(--brand); box-shadow: none; }
  .btn + .btn { margin-top: 10px; }

  .done { text-align: center; }
  .done .ok {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px; background: var(--ok); color: #fff;
    display: grid; place-items: center; animation: pop .35s ease-out;
  }
  .done h2 { justify-content: center; margin-bottom: 4px; }
  .done .sum { text-align: left; margin-top: 18px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ---------- Meus horários e Sobre ---------- */
  .page-h { margin: 4px 0 14px; font: 700 26px/1.15 var(--display); }
  .appt { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(20,40,75,.08); }
  .appt.old { opacity: .62; }
  .appt .when { font: 700 20px/1.2 var(--display); }
  .appt .what { margin: 4px 0 0; color: var(--muted); }
  .tag { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #e3f3ea; color: var(--ok); }
  .tag.off { background: #eceef2; color: var(--muted); }
  .appt .btn { margin-top: 12px; padding: 12px; font-size: 16px; background: transparent; color: var(--accent); border: 2px solid var(--accent); box-shadow: none; }
  .empty { text-align: center; color: var(--muted); padding: 36px 12px; }
  .empty b { display: block; color: var(--ink); font: 600 20px/1.2 var(--display); margin-bottom: 6px; }

  .about { display: grid; gap: 14px; }
  .about .sheet h3 { margin: 0 0 8px; font: 600 19px/1.2 var(--display); }
  .about p { margin: 0 0 12px; }
  .about a.btn { text-decoration: none; text-align: center; font-size: 16px; padding: 13px; }
  .hours { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .hours li { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 10px; }
  .hours li.today { background: #eef3fb; font-weight: 700; }
  .hours .closed { color: var(--muted); }

  /* ---------- Barra de baixo ---------- */
  nav.bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #fff;
    border-top: 1px solid var(--line); display: flex; justify-content: center;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav.bar .in { display: flex; width: 100%; max-width: 560px; }
  nav.bar button {
    flex: 1; border: 0; background: none; padding: 8px 4px; display: grid; justify-items: center; gap: 3px;
    color: var(--muted); font-size: 12.5px; font-weight: 600; border-radius: 12px;
  }
  nav.bar button[aria-current="page"] { color: var(--accent); }
  nav.bar svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  #toast {
    position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px);
    z-index: 20; max-width: min(92vw, 460px); padding: 12px 18px; border-radius: 12px; background: var(--ink); color: #fff;
    font-weight: 600; font-size: 15px; text-align: center; opacity: 0; pointer-events: none; transition: all .2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: #a3162a; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="logo-wrap" id="logo"></div>
  <h1 id="shop">__SHOP_NAME__</h1>
  <p id="tagline"></p>
</header>
<div class="pole" aria-hidden="true"></div>

<main>
  <noscript><p>Ative o JavaScript para agendar seu horário.</p></noscript>

  <!-- Agendar -->
  <section id="tab-book">
    <div id="flow">
      <div class="step" id="s-service">
        <h2><span class="n">1</span>Escolha o serviço</h2>
        <div id="services"></div>
        <div id="extras-box" hidden>
          <p class="sub">Adicione também</p>
          <div class="chips" id="extras"></div>
        </div>
      </div>

      <div class="step" id="s-barber" hidden>
        <h2><span class="n">2</span>Com quem?</h2>
        <div class="chips" id="barbers"></div>
      </div>

      <div class="step" id="s-when" hidden>
        <h2><span class="n">3</span>Dia e horário</h2>
        <div class="dates" id="dates" role="listbox" aria-label="Dias disponíveis"></div>
        <div id="times-box" hidden>
          <p class="sub" id="times-title">Horários livres</p>
          <div class="times" id="times"></div>
        </div>
        <p class="note" id="when-note" hidden></p>
      </div>

      <div class="step" id="s-you" hidden>
        <h2><span class="n">4</span>Confirme seus dados</h2>
        <form class="sheet" id="form" novalidate>
          <dl class="sum" id="summary"></dl>
          <p class="pay">O pagamento é feito na barbearia.</p>
          <label class="f">Nome e sobrenome
            <input id="name" name="name" autocomplete="name" autocapitalize="words" placeholder="Como devemos te chamar?" maxlength="40">
          </label>
          <label class="f">Telefone com DDD
            <input id="phone" name="tel" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="(35) 99999-9999" maxlength="15">
          </label>
          <button class="btn" id="submit" type="submit">Agendar</button>
        </form>
      </div>
    </div>

    <div class="sheet done" id="done" hidden></div>
  </section>

  <!-- Meus horários -->
  <section id="tab-mine" hidden>
    <h2 class="page-h">Meus horários</h2>
    <div id="mine"></div>
  </section>

  <!-- Sobre: endereço e horários só aparecem aqui -->
  <section id="tab-about" hidden>
    <h2 class="page-h">Sobre a barbearia</h2>
    <div class="about" id="about"></div>
  </section>
</main>

<nav class="bar" aria-label="Seções">
  <div class="in">
    <button type="button" data-tab="book" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
      Agendar
    </button>
    <button type="button" data-tab="mine">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      Meus horários
    </button>
    <button type="button" data-tab="about">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
      Sobre
    </button>
  </div>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var state = { cfg: null, serviceId: null, extras: [], barber: 'any', date: null, start: null, assigned: null, reqId: 0 };
  var MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var WEEK = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var WEEK_FULL = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  function h(tag, props) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];
      if (k === 'class') e.className = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(function (c) {
        if (c == null || c === false) return;
        e.append(c.nodeType ? c : document.createTextNode(c));
      });
    }
    return e;
  }
  var clear = function (el) { el.textContent = ''; return el; };

  function money(c) { return (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function dur(m) { return m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '') : m + ' min'; }
  function parts(date) { var p = date.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function dateLabel(date) { var d = parts(date); return WEEK[d.getDay()] + ' ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
  function validToken(t) { return /^[a-f0-9]{32}$/.test(t); }

  var toastTimer;
  function toast(msg, isErr) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ''; }, 3600);
  }

  async function api(path, body) {
    var opt = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
    var r = await fetch(path, opt);
    var data = await r.json().catch(function () { return {}; });
    if (!r.ok) {
      var e = new Error(data.message || 'Algo deu errado. Tente de novo.');
      e.code = data.error;
      throw e;
    }
    return data;
  }

  function reveal(sel, scroll) {
    var el = $(sel);
    var wasHidden = el.hidden;
    el.hidden = false;
    if (scroll) setTimeout(function () { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, wasHidden ? 60 : 0);
  }

  /* ---------- Topo ---------- */
  function renderHero(cfg) {
    var wrap = clear($('#logo'));
    var mono = function () {
      clear(wrap).append(h('span', { class: 'mono', 'aria-hidden': 'true' }, cfg.shopName.trim().slice(0, 2).toUpperCase()));
    };
    if (cfg.logo) {
      var img = h('img', { src: cfg.logo, alt: 'Logo ' + cfg.shopName });
      img.addEventListener('error', mono);
      img.addEventListener('load', function () {
        var r = img.naturalWidth / img.naturalHeight;
        if (Math.abs(r - 1) > 0.15) wrap.classList.add('wide');
      });
      wrap.append(img);
    } else mono();
    $('#shop').textContent = cfg.shopName;
    $('#tagline').textContent = cfg.tagline;
  }

  /* ---------- Passo 1: serviço e extras ---------- */
  function renderServices() {
    var box = clear($('#services'));
    state.cfg.services.forEach(function (s) {
      var input = h('input', { type: 'radio', name: 'service', value: s.id });
      var label = h('label', { class: 'svc' + (state.serviceId === s.id ? ' on' : '') }, input,
        h('div', { class: 'in' },
          s.photo ? h('img', { class: 'photo', src: s.photo, alt: '', loading: 'lazy' }) : null,
          h('div', { class: 'txt' },
            h('span', { class: 'name' }, s.name),
            s.description ? h('span', { class: 'desc' }, s.description) : null,
            h('span', { class: 'meta' }, money(s.priceCents), h('span', {}, dur(s.durationMin)))),
          h('span', { class: 'tick', 'aria-hidden': 'true' },
            svg('<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'))));
      input.addEventListener('change', function () { selectService(s.id); });
      box.append(label);
    });
  }

  function svg(inner, size) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', String(size || 16)); s.setAttribute('height', String(size || 16));
    s.innerHTML = inner;
    return s;
  }

  function renderExtras() {
    var list = state.cfg.extras;
    $('#extras-box').hidden = !list.length || !state.serviceId;
    var box = clear($('#extras'));
    list.forEach(function (x) {
      var on = state.extras.indexOf(x.id) >= 0;
      var input = h('input', { type: 'checkbox', value: x.id, checked: on });
      input.addEventListener('change', function () { toggleExtra(x.id); });
      box.append(h('label', { class: 'chip' + (on ? ' on' : '') }, input,
        h('span', { class: 'in' }, (on ? '✓ ' : '+ ') + x.name, h('small', {}, money(x.priceCents)))));
    });
  }

  function renderBarbers() {
    var box = clear($('#barbers'));
    [{ id: 'any', name: 'Tanto faz' }].concat(state.cfg.barbers).forEach(function (b) {
      var input = h('input', { type: 'radio', name: 'barber', value: b.id, checked: state.barber === b.id });
      input.addEventListener('change', function () { selectBarber(b.id); });
      box.append(h('label', { class: 'pill' + (state.barber === b.id ? ' on' : '') }, input, h('span', { class: 'in' }, b.name)));
    });
  }

  function selectService(id) {
    state.serviceId = id;
    renderServices(); renderExtras();
    reveal('#s-barber', true);
    reveal('#s-when');
    refreshDates();
    updateSummary();
  }

  function toggleExtra(id) {
    var i = state.extras.indexOf(id);
    if (i >= 0) state.extras.splice(i, 1); else state.extras.push(id);
    renderExtras();
    refreshDates();
    updateSummary();
  }

  function selectBarber(id) {
    state.barber = id;
    renderBarbers();
    reveal('#s-when', true);
    refreshDates();
    updateSummary();
  }

  /* ---------- Passo 3: dia e horário ---------- */
  function query(extra) {
    var q = 'service=' + encodeURIComponent(state.serviceId) + '&barber=' + encodeURIComponent(state.barber) +
      '&extras=' + encodeURIComponent(state.extras.join(','));
    return extra ? q + extra : q;
  }

  async function refreshDates() {
    var id = ++state.reqId;
    try {
      var res = await api('/api/dates?' + query());
      if (id !== state.reqId) return;
      var box = clear($('#dates'));
      var note = $('#when-note');
      if (!res.dates.length) {
        note.hidden = false;
        note.textContent = 'Não há horários livres nos próximos dias para essa escolha. Tente outro barbeiro ou fale com a barbearia.';
        $('#times-box').hidden = true;
        state.date = null; state.start = null;
        updateSummary();
        return;
      }
      note.hidden = true;
      if (state.date && res.dates.indexOf(state.date) < 0) { state.date = null; state.start = null; }
      res.dates.forEach(function (d) {
        var p = parts(d);
        var b = h('button', { type: 'button', class: 'date' + (state.date === d ? ' on' : ''), role: 'option', 'aria-selected': String(state.date === d), 'aria-label': dateLabel(d) },
          h('span', { class: 'w' }, WEEK[p.getDay()]),
          h('span', { class: 'd' }, String(p.getDate())),
          h('span', { class: 'm' }, MONTHS[p.getMonth()]));
        b.addEventListener('click', function () { selectDate(d); });
        box.append(b);
      });
      if (state.date) await refreshSlots(); else $('#times-box').hidden = true;
      updateSummary();
    } catch (e) { toast(e.message, true); }
  }

  function selectDate(d) {
    state.date = d; state.start = null;
    [].forEach.call(document.querySelectorAll('.date'), function (el) {
      var on = el.getAttribute('aria-label') === dateLabel(d);
      el.classList.toggle('on', on); el.setAttribute('aria-selected', String(on));
    });
    updateSummary();
    refreshSlots().then(function () {
      setTimeout(function () { $('#times-box').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 40);
    });
  }

  async function refreshSlots() {
    try {
      var res = await api('/api/slots?' + query('&date=' + state.date));
      var box = clear($('#times'));
      $('#times-box').hidden = false;
      $('#times-title').textContent = 'Horários livres em ' + dateLabel(state.date);
      if (state.start != null && !res.slots.some(function (s) { return s.start === state.start; })) state.start = null;
      if (!res.slots.length) box.append(h('p', { class: 'note' }, 'Sem horários nesse dia. Escolha outro dia.'));
      res.slots.forEach(function (s) {
        var b = h('button', { type: 'button', class: 'time' + (state.start === s.start ? ' on' : '') }, s.time);
        b.addEventListener('click', function () { selectTime(s); });
        box.append(b);
      });
      updateSummary();
    } catch (e) { toast(e.message, true); }
  }

  function selectTime(s) {
    state.start = s.start; state.assigned = s.barber; state.time = s.time;
    [].forEach.call(document.querySelectorAll('.time'), function (el) { el.classList.toggle('on', el.textContent === s.time); });
    updateSummary();
    reveal('#s-you', true);
  }

  /* ---------- Passo 4: resumo e envio ---------- */
  function selection() {
    var cfg = state.cfg;
    var main = cfg.services.filter(function (s) { return s.id === state.serviceId; })[0];
    if (!main) return null;
    var ex = cfg.extras.filter(function (x) { return state.extras.indexOf(x.id) >= 0; });
    var all = [main].concat(ex);
    return {
      name: all.map(function (p) { return p.name; }).join(' + '),
      price: all.reduce(function (n, p) { return n + p.priceCents; }, 0),
      minutes: all.reduce(function (n, p) { return n + p.durationMin; }, 0)
    };
  }

  function updateSummary() {
    var sel = selection();
    var ready = sel && state.date && state.start != null;
    $('#s-you').hidden = !ready;
    if (!ready) return;
    var barber = state.barber === 'any' ? state.assigned : state.cfg.barbers.filter(function (b) { return b.id === state.barber; })[0].name;
    var row = function (k, v, cls) { return h('div', { class: cls || '' }, h('dt', {}, k), h('dd', {}, v)); };
    clear($('#summary')).append(
      row('Serviço', sel.name),
      row('Barbeiro', barber),
      row('Quando', dateLabel(state.date) + ' às ' + state.time),
      row('Duração', dur(sel.minutes)),
      row('Total', money(sel.price), 'total'));
  }

  function maskPhone(v) {
    var d = v.replace(/\D/g, '').slice(0, 11);
    if (d.length > 6) { var cut = d.length > 10 ? 7 : 6; return '(' + d.slice(0, 2) + ') ' + d.slice(2, cut) + '-' + d.slice(cut); }
    if (d.length > 2) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
    return d ? '(' + d : '';
  }

  async function submit(e) {
    e.preventDefault();
    var name = $('#name').value.trim();
    var phone = $('#phone').value;
    if (name.length < 2) { toast('Informe seu nome.', true); $('#name').focus(); return; }
    if (phone.replace(/\D/g, '').length < 10) { toast('Informe o telefone com DDD.', true); $('#phone').focus(); return; }

    var btn = $('#submit');
    btn.disabled = true; btn.textContent = 'Agendando…';
    try {
      var res = await api('/api/book', {
        name: name, phone: phone, service: state.serviceId, extras: state.extras,
        barber: state.barber, date: state.date, start: state.start
      });
      store.set('bk.profile', { name: name, phone: phone });
      var tokens = store.get('bk.tokens', []).filter(validToken);
      tokens.unshift(res.token);
      store.set('bk.tokens', tokens.slice(0, 20));
      showDone(res.appointment);
    } catch (err) {
      toast(err.message, true);
      if (err.code === 'conflict') { state.start = null; $('#s-you').hidden = true; refreshDates(); }
    } finally {
      btn.disabled = false; btn.textContent = 'Agendar';
    }
  }

  function showDone(a) {
    $('#flow').hidden = true;
    var done = clear($('#done'));
    done.hidden = false;
    var row = function (k, v, cls) { return h('div', { class: cls || '' }, h('dt', {}, k), h('dd', {}, v)); };
    done.append(
      h('div', { class: 'ok' }, svg('<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>', 34)),
      h('h2', {}, 'Horário confirmado'),
      h('p', { class: 'note' }, state.cfg.remindersEnabled ? 'Você vai receber a confirmação e um lembrete no WhatsApp.' : 'Anote o dia e o horário.'),
      h('dl', { class: 'sum' },
        row('Serviço', a.service), row('Barbeiro', a.barber),
        row('Quando', dateLabel(a.date) + ' às ' + a.time), row('Total', money(a.priceCents), 'total')),
      h('p', { class: 'pay' }, 'O pagamento é feito na barbearia.'),
      h('button', { class: 'btn', type: 'button', onclick: function () { downloadIcs(a); } }, 'Adicionar ao calendário'),
      h('button', { class: 'btn ghost', type: 'button', onclick: resetFlow }, 'Fazer outro agendamento'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetFlow() {
    state.serviceId = null; state.extras = []; state.barber = 'any'; state.date = null; state.start = null;
    $('#done').hidden = true; $('#flow').hidden = false;
    ['#extras-box', '#s-barber', '#s-when', '#s-you'].forEach(function (s) { $(s).hidden = true; });
    renderServices(); renderExtras(); renderBarbers();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function downloadIcs(a) {
    var esc = function (s) { return String(s).replace(/[,;\\]/g, '\\$&'); };
    var d = a.date.replace(/-/g, '');
    var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Agendamento//PT-BR', 'BEGIN:VEVENT',
      'UID:' + a.id + '-' + d + '@agendamento',
      'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z',
      'DTSTART:' + d + 'T' + a.time.replace(':', '') + '00',
      'DTEND:' + d + 'T' + a.endTime.replace(':', '') + '00',
      'SUMMARY:' + esc(a.service + ' - ' + state.cfg.shopName),
      'LOCATION:' + esc(state.cfg.address),
      'END:VEVENT', 'END:VCALENDAR'];
    var url = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/calendar' }));
    var link = h('a', { href: url, download: 'horario.ics' });
    document.body.append(link); link.click(); link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* ---------- Meus horários ---------- */
  async function loadMine() {
    var box = clear($('#mine'));
    var tokens = store.get('bk.tokens', []).filter(validToken);
    if (!tokens.length) {
      box.append(h('div', { class: 'empty' }, h('b', {}, 'Nenhum horário marcado'),
        'Os horários que você agendar neste aparelho aparecem aqui.'));
      return;
    }
    try {
      var res = await api('/api/mine', { tokens: tokens });
      var list = res.appointments;
      if (!list.length) {
        box.append(h('div', { class: 'empty' }, h('b', {}, 'Nenhum horário encontrado'), 'Seus horários anteriores não estão mais disponíveis.'));
        return;
      }
      var up = list.filter(function (a) { return a.status === 'confirmed' && !a.isPast; });
      var old = list.filter(function (a) { return !(a.status === 'confirmed' && !a.isPast); }).reverse();
      if (!up.length) box.append(h('div', { class: 'empty' }, h('b', {}, 'Nenhum horário à frente'), 'Use a aba Agendar para marcar um novo.'));
      up.concat(old).forEach(function (a) { box.append(apptCard(a)); });
    } catch (e) { toast(e.message, true); }
  }

  function apptCard(a) {
    var active = a.status === 'confirmed' && !a.isPast;
    var tag = a.status === 'cancelled' ? 'Cancelado' : a.isPast ? 'Concluído' : 'Confirmado';
    return h('div', { class: 'appt' + (active ? '' : ' old') },
      h('div', { class: 'when' }, dateLabel(a.date) + ' às ' + a.time),
      h('p', { class: 'what' }, a.service + ' com ' + a.barber + ' - ' + money(a.priceCents)),
      h('span', { class: 'tag' + (active ? '' : ' off') }, tag),
      active && a.canCancel ? h('button', { class: 'btn', type: 'button', onclick: function () { cancel(a); } }, 'Cancelar horário') : null,
      active && !a.canCancel ? h('p', { class: 'note' }, 'Para cancelar agora, ligue para ' + state.cfg.phone + '.') : null);
  }

  async function cancel(a) {
    if (!window.confirm('Cancelar o horário de ' + dateLabel(a.date) + ' às ' + a.time + '?')) return;
    try {
      await api('/api/cancel', { token: a.token });
      toast('Horário cancelado.');
      loadMine();
      if (state.serviceId) refreshDates();
    } catch (e) { toast(e.message, true); loadMine(); }
  }

  /* ---------- Sobre ---------- */
  function renderAbout() {
    var cfg = state.cfg;
    var mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(cfg.shopName + ' ' + cfg.address);
    var order = [1, 2, 3, 4, 5, 6, 0];
    var hours = h('ul', { class: 'hours' }, order.map(function (d) {
      var x = cfg.hours[String(d)];
      return h('li', { class: d === cfg.todayDow ? 'today' : '' },
        h('span', {}, WEEK_FULL[d]),
        x ? h('span', {}, x.open + ' às ' + x.close) : h('span', { class: 'closed' }, 'Fechado'));
    }));
    clear($('#about')).append(
      h('div', { class: 'sheet' }, h('h3', {}, 'Endereço'), h('p', {}, cfg.address),
        h('a', { class: 'btn ghost', href: mapUrl, target: '_blank', rel: 'noopener' }, 'Abrir no mapa')),
      h('div', { class: 'sheet' }, h('h3', {}, 'Contato'), h('p', {}, cfg.phone),
        h('a', { class: 'btn ghost', href: 'tel:' + cfg.phone.replace(/[^\d+]/g, '') }, 'Ligar'),
        cfg.whatsapp ? h('a', { class: 'btn ghost', href: 'https://wa.me/' + cfg.whatsapp, target: '_blank', rel: 'noopener' }, 'Chamar no WhatsApp') : null),
      h('div', { class: 'sheet' }, h('h3', {}, 'Horário de funcionamento'), hours));
  }

  /* ---------- Abas ---------- */
  function showTab(name) {
    ['book', 'mine', 'about'].forEach(function (t) { $('#tab-' + t).hidden = t !== name; });
    [].forEach.call(document.querySelectorAll('nav.bar button'), function (b) {
      if (b.dataset.tab === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (name === 'mine') loadMine();
    window.scrollTo({ top: 0 });
  }

  /* ---------- Início ---------- */
  async function boot() {
    try {
      state.cfg = await api('/api/config');
    } catch (e) {
      $('#flow').append(h('p', { class: 'note' }, 'Não foi possível carregar. Atualize a página.'));
      return;
    }
    renderHero(state.cfg); renderServices(); renderExtras(); renderBarbers(); renderAbout();

    var profile = store.get('bk.profile', null);
    if (profile) { $('#name').value = profile.name || ''; $('#phone').value = profile.phone || ''; }

    // Link de cancelamento recebido por WhatsApp: guarda o agendamento neste aparelho e abre "Meus horários"
    var t = new URLSearchParams(location.search).get('cancelar');
    if (t && validToken(t)) {
      var tokens = store.get('bk.tokens', []).filter(validToken);
      if (tokens.indexOf(t) < 0) tokens.unshift(t);
      store.set('bk.tokens', tokens.slice(0, 20));
      history.replaceState(null, '', location.pathname);
      showTab('mine');
    }
  }

  document.querySelectorAll('nav.bar button').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });
  $('#form').addEventListener('submit', submit);
  $('#phone').addEventListener('input', function (e) { e.target.value = maskPhone(e.target.value); });
  boot();
})();
</script>
</body>
</html>
